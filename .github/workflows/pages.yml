name: Build gh-pages branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode images and publish to gh-pages
        run: |
          mkdir -p out/img
          cp index.html style.css app.js out/
          mkdir -p out/kit && cp kit/index.html out/kit/
          for f in img/*.b64; do base64 -d "$f" > "out/${f%.b64}"; done
          touch out/.nojekyll
          ls -la out out/img
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
